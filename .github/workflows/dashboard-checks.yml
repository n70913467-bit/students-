name: Dashboard basic checks
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-local-startup:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP with SQLite
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
      - name: Start the Windows helper and create the first admin
        shell: pwsh
        run: |
          $stdout = Join-Path $env:TEMP 'dashboard-startup.log'
          $stderr = Join-Path $env:TEMP 'dashboard-startup-error.log'
          $process = Start-Process -FilePath 'cmd.exe' -ArgumentList '/c', 'start-local.bat' -WorkingDirectory $env:GITHUB_WORKSPACE -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $ready = $false
            $setupKey = $null
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              if (Test-Path $stdout) {
                $output = Get-Content -Raw $stdout
                if ($output -match 'First-admin setup key \(copy this into the browser form\):\s*([a-f0-9]{64})') {
                  $setupKey = $Matches[1]
                }
              }
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8000/api/health' -TimeoutSec 2
                if ($health.ok -eq $true) { $ready = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $ready) {
              if (Test-Path $stderr) { Get-Content $stderr }
              if (Test-Path $stdout) { Get-Content $stdout }
              throw 'start-local.bat did not start the API health endpoint'
            }
            if (-not $setupKey) { throw 'start-local.bat did not print a 64-character setup key' }
            $payload = @{
              name = 'Windows CI Admin'
              email = 'windows-ci-admin@example.test'
              password = 'windows-ci-password-123'
              setup_key = $setupKey
            } | ConvertTo-Json
            $created = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:8000/api/auth/register' -ContentType 'application/json' -Body $payload
            if ($created.user.role -ne 'admin') { throw 'Windows first-admin registration did not return an admin user' }
          } finally {
            & taskkill.exe /PID $process.Id /T /F 2>$null | Out-Null
            Remove-Item (Join-Path $env:GITHUB_WORKSPACE 'storage') -Recurse -Force -ErrorAction SilentlyContinue
          }

  verify-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify required files
        run: |
          test -f index.html
          test -f README.md
          test -f api.php
          test -f app.js
          test -f csv.js
          test -f tests/csv.test.mjs
          test -f router.php
          test -f schema.sql
          test -f tests/api-smoke.sh
          test -f tests/api-client.test.mjs
          test -f tests/frontend-contract.test.mjs
          test -f .gitignore
          test -f deployment/environment.example
          test -f docs/deployment.md
          test -f docs/docker.md
          test -f Dockerfile
          test -f docker-compose.yml
          test -f deployment/preflight.php
          test -f tests/preflight-smoke.sh
      - name: Verify dashboard scope and core features
        run: |
          grep -q "Project Control Dashboard" index.html
          grep -q "Development Roadmap" index.html
          grep -q "Export CSV" index.html
          grep -q "No payment features" index.html
          grep -q "RewriteEngine On" .htaccess
          grep -q "Header always set X-Frame-Options" .htaccess
          grep -q "a2enmod rewrite headers" Dockerfile
          grep -Fq 'PROJECT_DASHBOARD_COOKIE_SECURE: ${PROJECT_DASHBOARD_COOKIE_SECURE:-0}' docker-compose.yml
          grep -q '127.0.0.1:8080:80' docker-compose.yml
          grep -q "RewriteRule \\^storage" .htaccess
          grep -Fq 'RewriteRule ^(?:\.git|\.github|docs|tests|deployment)' .htaccess
          grep -q "blockedPath" router.php
          grep -q "Require all denied" storage/.htaccess
          ! grep -Eiq "paymentGateway|paymentForm|upiIntegration|cardProcessor" index.html
      - name: Set up PHP with SQLite
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
      - name: Check PHP syntax
        run: |
          php -l api.php
          php -l router.php
          php -l deployment/preflight.php
      - name: Validate SQLite schema
        run: |
          php -r '$pdo = new PDO("sqlite::memory:"); $pdo->exec(file_get_contents("schema.sql")); $tables = $pdo->query("SELECT name FROM sqlite_master WHERE type = char(116,97,98,108,101)")->fetchAll(PDO::FETCH_COLUMN); foreach (["users","projects","project_members","tasks","activity_logs","approval_requests","login_attempts"] as $table) { if (!in_array($table, $tables, true)) { fwrite(STDERR, "Missing schema table: $table"); exit(1); } }'
      - name: Check smoke test shell syntax
        run: |
          bash -n tests/api-smoke.sh
          bash -n tests/preflight-smoke.sh
      - name: Run deployment preflight tests
        run: bash tests/preflight-smoke.sh
      - name: Run API smoke tests
        run: bash tests/api-smoke.sh
      - name: Check frontend JavaScript syntax
        run: |
          node --check app.js
          node --check api-client.js
          node --check csv.js
      - name: Run JavaScript API client tests
        run: npm run test:client
      - name: Run frontend DOM contract tests
        run: npm run test:ui
      - name: Run CSV export security tests
        run: npm run test:csv

      - name: Validate Docker Compose configuration
        run: |
          PROJECT_DASHBOARD_SETUP_KEY=ci-compose-setup-key-0123456789abcdef docker compose config --quiet
          env -u PROJECT_DASHBOARD_SETUP_KEY docker compose config --quiet

      - name: Build PHP Apache Docker image
        run: docker build --tag project-control-dashboard:ci .

      - name: Smoke test the Docker container
        run: |
          docker volume create dashboard-smoke-data >/dev/null
          docker run -d --name project-dashboard-smoke -p 127.0.0.1:8789:80 \
            -e PROJECT_DASHBOARD_COOKIE_SECURE=0 \
            -e PROJECT_DASHBOARD_SETUP_KEY=ci-docker-setup-key-0123456789abcdef \
            -v dashboard-smoke-data:/var/lib/project-control \
            project-control-dashboard:ci
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "Docker container logs for diagnosis:"
              docker logs project-dashboard-smoke 2>&1 || true
            fi
            docker rm -f project-dashboard-smoke >/dev/null 2>&1 || true
            docker volume rm dashboard-smoke-data >/dev/null 2>&1 || true
            return "$status"
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8789/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8789/api/health | grep -q '"ok":true'
          curl -fsS -D - -o /dev/null http://127.0.0.1:8789/ | grep -qi '^X-Frame-Options: DENY'
          curl -fsS -D - -o /dev/null http://127.0.0.1:8789/ | grep -qi '^Content-Security-Policy:'
          for private_path in README.md docs/deployment.md tests/api-smoke.sh deployment/environment.example .gitignore .htaccess router.php; do
            private_status="$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:8789/$private_path")"
            test "$private_status" = "403"
          done
          curl -fsS -H 'Content-Type: application/json' \
            -d '{"name":"CI Admin","email":"ci-admin@example.test","password":"ci-password-12345","setup_key":"ci-docker-setup-key-0123456789abcdef"}' \
            http://127.0.0.1:8789/api/auth/register | grep -q '"role":"admin"'
          unauth_status="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8789/api/projects)"
          test "$unauth_status" = "401"

          # Stop gracefully so SQLite can finish writes before the volume is reused.
          docker stop --time 10 project-dashboard-smoke >/dev/null
          docker rm project-dashboard-smoke >/dev/null
          docker run -d --name project-dashboard-smoke -p 127.0.0.1:8789:80 \
            -e PROJECT_DASHBOARD_COOKIE_SECURE=0 \
            -e PROJECT_DASHBOARD_SETUP_KEY=ci-docker-setup-key-0123456789abcdef \
            -v dashboard-smoke-data:/var/lib/project-control \
            project-control-dashboard:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8789/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8789/api/health | grep -q '"ok":true'
          duplicate_status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI Admin","email":"ci-admin@example.test","password":"ci-password-12345","setup_key":"ci-docker-setup-key-0123456789abcdef"}' \
            http://127.0.0.1:8789/api/auth/register)"
          # The API closes first-admin registration with HTTP 403 once an account exists.
          test "$duplicate_status" = "403"
